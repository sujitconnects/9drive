services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-9drive}
      MYSQL_USER: ${MYSQL_USER:-9drive}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -u
        - root
        - -p${MYSQL_ROOT_PASSWORD}
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - 9drive-network

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-9drive}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-9drive}

      APP_PORT: 4000

      FRONTEND_URL: ${FRONTEND_URL}

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}

      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}

      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-3600}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}

      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5368709120}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}

    expose:
      - "4000"

    networks:
      - 9drive-network
      - dokploy-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-}
    restart: unless-stopped
    depends_on:
      - backend

    expose:
      - "80"

    networks:
      - 9drive-network
      - dokploy-network

networks:
  9drive-network:
    driver: bridge

  dokploy-network:
    external: true

volumes:
  mysql_data:
